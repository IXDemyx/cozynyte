<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="author" content="Daniel Keller" />
    <meta name="theme-color" content="#0f0f0f" />
    <!-- Titel, Beschreibung, Sprachversionen und Link-Vorschau: je Sprache aus src/lib/seo.ts -->
    <!--seo-head-->

    <!-- Dunkles bzw. helles Design sofort setzen – sonst blitzt die Seite kurz weiß auf. -->
    <script>
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>

    <!-- Vorab-HTML der Startseite (für Suchmaschinen): Besucher sehen nur kurz das Logo. -->
    <style>
      .prerender-splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          600 1.5rem/1 "JetBrains Mono",
          ui-monospace,
          monospace;
        color: var(--text-primary);
      }
      .prerender-splash span {
        color: var(--accent);
      }
      .prerender-content {
        max-width: 48rem;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
        font-family: Inter, system-ui, sans-serif;
        line-height: 1.6;
        color: var(--text-secondary);
      }
      .prerender-content h1,
      .prerender-content h2,
      .prerender-content h3,
      .prerender-content strong {
        color: var(--text-primary);
      }
      .prerender-content h1 {
        font-size: 2rem;
        font-weight: 800;
        line-height: 1.2;
      }
      .prerender-content h2 {
        margin-top: 2rem;
        font-size: 1.15rem;
        font-weight: 700;
      }
      .prerender-content h3 {
        margin-top: 1rem;
        font-weight: 600;
      }
      .prerender-content p {
        margin: 0.5rem 0;
      }
      .prerender-content ul,
      .prerender-content ol {
        margin: 0.5rem 0;
        padding-left: 1.25rem;
        list-style: disc;
      }
      .prerender-content ol {
        list-style: decimal;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
