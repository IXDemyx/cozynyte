<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="author" content="Daniel Keller" />
    <!-- Browserleiste (Handy) in den Farben des blauen Designs: Mocha dunkel, Latte hell. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181825" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eff1f5" />
    <!-- Titel, Beschreibung, Sprachversionen und Link-Vorschau: je Sprache aus src/lib/seo.ts -->
    <!--seo-head-->

    <!-- Hell/dunkel und Design sofort setzen – sonst blitzt die Seite kurz in falschen Farben auf.
         Standard ist das blaue Design „cozy“ (Schlüssel wie in src/hooks/useTheme.ts). -->
    <script>
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.toggle("dark", dark);
        var palette = localStorage.getItem("design");
        if (palette !== "classic")
          document.documentElement.classList.add(palette === "evening" ? "evening" : "cozy");
      } catch (e) {
        document.documentElement.classList.add("dark", "cozy");
      }
    </script>

    <!-- Vorab-HTML der Startseite (für Suchmaschinen): Besucher sehen nur kurz das Logo. -->
    <style>
      .prerender-splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          700 1.6rem/1 Inter,
          system-ui,
          sans-serif;
        letter-spacing: -0.02em;
        color: var(--text-primary);
      }
      .prerender-splash span {
        color: var(--accent);
      }
      .prerender-content {
        max-width: 48rem;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
        font-family: Inter, system-ui, sans-serif;
        line-height: 1.6;
        color: var(--text-secondary);
      }
      .prerender-content h1,
      .prerender-content h2,
      .prerender-content h3,
      .prerender-content strong {
        color: var(--text-primary);
      }
      .prerender-content h1 {
        font-size: 2rem;
        font-weight: 800;
        line-height: 1.2;
      }
      .prerender-content h2 {
        margin-top: 2rem;
        font-size: 1.15rem;
        font-weight: 700;
      }
      .prerender-content h3 {
        margin-top: 1rem;
        font-weight: 600;
      }
      .prerender-content p {
        margin: 0.5rem 0;
      }
      .prerender-content ul,
      .prerender-content ol {
        margin: 0.5rem 0;
        padding-left: 1.25rem;
        list-style: disc;
      }
      .prerender-content ol {
        list-style: decimal;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
