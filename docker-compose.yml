# Startet Cozynyte: Frontend, API und WebSockets aus einem Container.
# Port 1337 wie bisher, damit der Cloudflare Tunnel unverändert weiterläuft.
services:
  cozynyte:
    build: .
    container_name: cozynyte
    restart: unless-stopped
    ports:
      - "1337:3001"
    environment:
      # Song des Tages: anonyme Zähler für den Vergleich mit allen – im Volume, damit ein
      # Neustart oder Deploy sie nicht löscht.
      - DATA_DIR=/app/data
    volumes:
      - cozynyte-data:/app/data

volumes:
  cozynyte-data:
